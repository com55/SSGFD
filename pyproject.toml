[project]
name = "ssgfd"
version = "0.1.0"
description = "Stella Sora Game Files Downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=38", "filelock>=3"]

[project.scripts]
ssgfd = "ssgfd.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssgfd"]

[dependency-groups]
dev = ["pytest>=7"]
